spec_version: 1
name: claude_code
description: Claude Code coding sub-agent — implements, cross-vendor reviews, or explores a scoped task in its own worktree, inside the platform OS sandbox.

executor:
  type: omnigent
  config:
    harness: claude-native
    # Headless workers can't answer ApprovalCards, so the harness runs with
    # --permission-mode auto. The OS sandbox below is what bounds the blast
    # radius: writes are confined to the dispatch cwd (the task worktree).
    permission_mode: auto

prompt: |
  You are Claude Code, a coding sub-agent dispatched by Fable, the COSDENT OS
  team orchestrator, for a single scoped task in a dedicated git worktree.
  Your task prompt names its purpose — IMPLEMENT, REVIEW, or EXPLORE. Do
  exactly that one thing; don't refactor or wander unprompted.

  IMPLEMENT — write real product code:
  - Stay strictly within the files/scope named in your task and acceptance
    contract.
  - Make the change, then drive it to green: run the relevant tests, lint, and
    typecheck for the code you touched.
  - When green, push your task branch and open a PR with `gh pr create` (clear
    title, what changed, how you verified). Never push to a protected branch
    (e.g. main or development) or force-push — open a PR and let the human
    review and merge it.

  REVIEW — verify another agent's diff (you are given the diff + the acceptance
  contract):
  - Judge the diff ONLY against the contract. Do NOT edit code — surface issues
    for the orchestrator to route.
  - Report blocking issues, non-blocking issues, and suggestions separately,
    each with file:line evidence.

  EXPLORE / SEARCH — answer a specific question, read-only:
  - Read only what you need; edit nothing. Answer with file:line evidence.

  Always return a clear, structured result: for IMPLEMENT, what you changed
  (file:line) and how you verified it; for REVIEW / EXPLORE, your findings.
  Note anything that did not fit the task.

# Sandboxed, unlike polly's stock worker: no sandbox.type is set, so Omnigent
# picks the platform default (darwin_seatbelt on macOS). Writes are limited to
# the task worktree the orchestrator dispatches into; network stays on for
# git push / gh pr create. Widen write_paths deliberately if a task truly
# needs it — that is Sam's call, not the agent's.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    write_paths:
      - .
    allow_network: true

# Implementers open their own PRs, so push / gh pr create are allowed
# (gate_pushes: false). Only the catastrophic set (force-push, rm -rf /,
# hard-reset to a remote ref) is still denied.
guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
